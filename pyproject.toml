[project]
name = "fundamentalist-agents"
version = "0.0.1"
description = "Evidence readers over SEC filings, started from LangChain's data-enrichment template"
authors = [
    { name = "David Arias" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0.0,<2.0.0",
    "langchain>=1.3.10",
    "langchain-openai>=1.1.14",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = ["mypy>=1.11.1,<3.0", "ruff>=0.6.1"]

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fundamentalist"]
[tool.setuptools.package-dir]
"fundamentalist" = "src/fundamentalist"


[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
include = ["*.py", "*.pyi", "*.ipynb"]
lint.ignore = ["UP006", "UP007", "UP035", "UP045", "D417", "E501"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
"ntbk/*" = ["D", "UP", "T201"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "langgraph-cli[inmem]>=0.1.71",
    "pytest>=9.0.3",
    "mypy>=1.11.1,<3.0",
]
